<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fushion Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@500&display=swap" rel="stylesheet">
</head>
<body style="font-family:DM Sans;background:#F7F5FB;color:#1D1A3A">
<!-- LOGIN -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-[32px] p-8 w-full max-w-md shadow-xl">
    <h1 class="text-2xl font-black text-center mb-2" style="font-family:Bricolage Grotesque">Fushion Admin</h1>
    <p class="text-center text-sm text-gray-500 mb-4">Password: fushion123</p>
    <input id="pw" type="password" placeholder="Password" class="w-full h-11 px-4 rounded-full border mb-3">
    <button id="loginBtn" class="w-full h-11 bg-[#1D1A3A] text-white rounded-full font-bold">Login</button>
    <p id="err" class="hidden text-red-500 text-sm mt-2 text-center">Wrong password</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden min-h-screen flex">
  <aside class="w-[240px] bg-white border-r p-5">
    <b class="block mb-6">FUSHION ADMIN</b>
    <nav class="space-y-1" id="nav">
      <button data-t="dash" class="w-full text-left px-4 py-2 rounded-full bg-black text-white">Dashboard</button>
      <button data-t="prod" class="w-full text-left px-4 py-2 rounded-full hover:bg-gray-100">Products</button>
      <button data-t="inv" class="w-full text-left px-4 py-2 rounded-full hover:bg-gray-100">Inventory</button>
      <button data-t="exp" class="w-full text-left px-4 py-2 rounded-full hover:bg-gray-100">Export</button>
    </nav>
    <a href="index.html" target="_blank" class="block mt-8 text-sm text-gray-500">← View Store</a>
  </aside>
  <main class="flex-1 p-6">
    <div id="dash" class="tab">
      <h2 class="text-3xl font-black mb-4">Dashboard</h2>
      <div id="kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6"></div>
      <div id="low" class="bg-white rounded-2xl p-4 border"></div>
    </div>
    <div id="prod" class="tab hidden">
      <div class="flex justify-between mb-4"><h2 class="text-2xl font-black">Products <span id="count"></span></h2><button id="addBtn" class="px-5 h-10 bg-[#F6A91B] rounded-full font-bold">+ Add</button></div>
      <input id="search" placeholder="Search products..." class="w-full h-10 px-4 rounded-full border mb-4">
      <div class="bg-white rounded-2xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3 text-left">Product</th><th class="p-3">Price</th><th class="p-3">Stock</th><th class="p-3">Action</th></tr></thead><tbody id="ptable"></tbody></table></div>
    </div>
    <div id="inv" class="tab hidden"><h2 class="text-2xl font-black mb-4">Inventory</h2><div id="invList"></div></div>
    <div id="exp" class="tab hidden"><h2 class="text-2xl font-black mb-4">Export to GitHub</h2><button id="dlBtn" class="w-full h-12 bg-black text-white rounded-full font-bold mb-4">Download Updated Code</button><textarea id="out" class="w-full h-[350px] p-3 text-xs font-mono bg-white border rounded-xl"></textarea></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl w-full max-w-lg p-6">
    <h3 class="font-bold mb-4">Add / Edit Product</h3>
    <form id="form" class="space-y-3">
      <input name="name" required placeholder="Product Name *" class="w-full h-10 px-4 rounded-full border">
      <div class="grid grid-cols-2 gap-2"><select name="cat" class="h-10 px-3 rounded-full border"><option>Action & Adventure</option><option>Educational</option><option>Plush & Soft</option><option>STEM & DIY</option><option>Outdoor & Sports</option><option>Wooden Classics</option></select><select name="age" class="h-10 px-3 rounded-full border"><option>6-8</option><option>0-2</option><option>3-5</option><option>9+</option></select></div>
      <div class="grid grid-cols-3 gap-2"><input name="price" type="number" placeholder="Price" class="h-10 px-3 rounded-full border"><input name="mrp" type="number" placeholder="MRP" class="h-10 px-3 rounded-full border"><input name="stock" type="number" placeholder="Stock" class="h-10 px-3 rounded-full border"></div>
      <input name="emoji" placeholder="Emoji ✈️ or paste image URL / upload below" class="w-full h-10 px-4 rounded-full border">
      <input type="file" id="imgFile" accept="image/*" class="w-full text-sm">
      <div id="preview"></div>
      <input name="badge" placeholder="Badge e.g. 53% OFF" class="w-full h-10 px-4 rounded-full border">
      <textarea name="desc" placeholder="Description" class="w-full p-3 rounded-xl border" rows="2"></textarea>
      <div class="flex gap-2"><button class="flex-1 h-11 bg-[#F6A91B] rounded-full font-bold">Save</button><button type="button" id="close" class="flex-1 h-11 border rounded-full">Cancel</button></div>
    </form>
  </div>
</div>

<script>
const DEFAULTS=[
{name:"Fushion Combat Aircraft Jet",cat:"Action & Adventure",age:"6-8",price:1169,mrp:2500,emoji:"✈️",stock:28,badge:"53% OFF",desc:"2.4GHz RC 360 flip 40m range 30m height Turbo LED",id:1},
{name:"Curious Cubes",cat:"Educational",age:"3-5",price:849,mrp:1299,emoji:"🧩",stock:18,badge:"Bestseller",desc:"64 wood shapes",id:2},
{name:"Golu Bear",cat:"Plush & Soft",age:"0-2",price:699,mrp:999,emoji:"🧸",stock:42,badge:"New",desc:"Soft bear",id:3}
];
let products=JSON.parse(localStorage.getItem('fi-admin')||'null')||DEFAULTS;
let editId=null, imgData=null;
const $=s=>document.querySelector(s);
const save=()=>{localStorage.setItem('fi-admin',JSON.stringify(products));render();};
function render(){
  $("#count").textContent=products.length;
  $("#kpis").innerHTML=`<div class="bg-white p-4 rounded-2xl border">Total<br><b class="text-xl">${products.length}</b></div><div class="bg-white p-4 rounded-2xl border">Low Stock<br><b class="text-xl text-red-600">${products.filter(p=>p.stock<12).length}</b></div><div class="bg-white p-4 rounded-2xl border">Value<br><b>₹${products.reduce((a,b)=>a+b.mrp*b.stock,0).toLocaleString('en-IN')}</b></div>`;
  $("#low").innerHTML=products.filter(p=>p.stock<12).map(p=>`<div class="py-2 border-b flex justify-between"><span>${p.emoji} ${p.name} - ${p.stock} left</span><button onclick="restock(${p.id})" class="text-xs bg-black text-white px-3 py-1 rounded-full">+10</button></div>`).join('')||'All stocked';
  const q=($("#search").value||'').toLowerCase();
  $("#ptable").innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<tr class="border-t"><td class="p-3">${p.emoji} ${p.name}</td><td class="p-3">₹${p.price}</td><td class="p-3">${p.stock}</td><td class="p-3"><button onclick="edit(${p.id})" class="px-3 py-1 bg-gray-100 rounded-full text-xs">Edit</button> <button onclick="del(${p.id})" class="px-3 py-1 bg-red-50 text-red-600 rounded-full text-xs">Del</button></td></tr>`).join('');
  $("#invList").innerHTML=products.map(p=>`<div class="bg-white p-3 rounded-xl border flex justify-between mb-2"><span>${p.emoji} ${p.name}</span><button onclick="restock(${p.id})" class="px-3 py-1 border rounded-full text-xs">+5 stock</button></div>`).join('');
  const code=`const P=[\n${products.map(p=>`["${p.name}","${p.cat}","${p.age}",${p.price},${p.mrp},4.5,100,"${p.emoji}","#FFD93D","#FF9F1C","${p.desc}",${p.stock},"${p.badge}",""]`).join(',\n')}\n]`;
  $("#out").value=code;
}
window.edit=id=>{const p=products.find(x=>x.id===id);editId=id;$("#form").name.value=p.name;$("#form").cat.value=p.cat;$("#form").age.value=p.age;$("#form").price.value=p.price;$("#form").mrp.value=p.mrp;$("#form").stock.value=p.stock;$("#form").emoji.value=p.emoji;$("#form").badge.value=p.badge;$("#form").desc.value=p.desc;$("#modal").classList.remove('hidden');$("#modal").classList.add('flex');};
window.del=id=>{if(confirm('Delete?')){products=products.filter(x=>x.id!==id);save();}};
window.restock=id=>{products.find(x=>x.id===id).stock+=10;save();};
$("#addBtn").onclick=()=>{editId=null;$("#form").reset();$("#modal").classList.remove('hidden');$("#modal").classList.add('flex');};
$("#close").onclick=()=>$("#modal").classList.add('hidden');
$("#form").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const o={name:fd.get('name'),cat:fd.get('cat'),age:fd.get('age'),price:+fd.get('price'),mrp:+fd.get('mrp')||+fd.get('price'),stock:+fd.get('stock')||10,emoji:fd.get('emoji')||"🧸",badge:fd.get('badge'),desc:fd.get('desc'),id:editId||Date.now()};if(editId){const i=products.findIndex(x=>x.id===editId);products[i]={...products[i],...o};}else products.push(o);$("#modal").classList.add('hidden');save();};
$("#search").oninput=render;
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));document.getElementById(b.dataset.t).classList.remove('hidden');});
$("#loginBtn").onclick=()=>{if($("#pw").value==="fushion123"||$("#pw").value==="admin"){$("#login").classList.add('hidden');$("#app").classList.remove('hidden');render();}else $("#err").classList.remove('hidden');};
$("#dlBtn").onclick=()=>{const blob=new Blob([$("#out").value],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='updated-products.txt';a.click();};
render();
</script>
</body>
</html>
